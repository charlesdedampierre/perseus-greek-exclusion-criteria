<text x="1000" y="600" font-size="11" fill="#7d7d7d" text-anchor="middle">Each node is a criterion; size and height both ∝ the number of rights it gates (higher = more).</text>
<text x="1000" y="616" font-size="11" fill="#7d7d7d" text-anchor="middle">An edge links a criterion to one above whose gated rights include all of its own —</text>
<text x="1000" y="632" font-size="11" fill="#7d7d7d" text-anchor="middle">the same set-inclusion ranking as the group graphs. Free gates every right; Wealthy only two.</text>
