<text x="900" y="474" font-size="11" fill="#7d7d7d" text-anchor="middle">Each panel restricts to one type of right; within it the criteria are ranked by how many rights of that type they gate — node size and height both ∝ that count (higher = more).</text>
<text x="900" y="490" font-size="11" fill="#7d7d7d" text-anchor="middle">An edge links a criterion to one above whose gated rights include all of its own. Free tops every type; the rest reshuffle — Wealthy gates only banking &amp; cavalry, birth-criteria dominate the religious sphere.</text>
